name: Update extra Israeli guides

on:
  schedule:
    - cron: '40 3 * * *'
    - cron: '40 15 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build extra guide
        run: python extra_epg.py extra.xml
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extra.xml
          git diff --cached --quiet || git commit -m "Update extra guides"
          git pull --rebase -q
          git push
      - name: Keep the schedule from being paused after 60 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/extra.yml/enable"
