name: Update HOT Family guide

on:
  schedule:
    - cron: '15 2 * * *'    # 04:15 Israel time
    - cron: '15 14 * * *'   # 16:15 Israel time
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build guide from hot.net.il
        run: python hot_family_epg.py hot_family.xml
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hot_family.xml
          git diff --cached --quiet || git commit -m "Update HOT Family guide"
          git push
      - name: Keep the schedule from being paused after 60 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable"
